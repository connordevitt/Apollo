name: CI


on: 
  pull_request: 
  push: 
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs: 
  backend: 
    runs-on: ubuntu-latest
    steps: 
     - uses: actions/checkout@v4

     - uses: actions/setup-node@v4
       with: 
        node-version: 24
        cache: npm
  
  web: 
   runs-on: ubuntu-latest
   defaults:
    run: 
      working-directory: web
   
   steps: 
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with: 
       node-version: 24
       cache: npm
       cache-dependency-path: web/package-lock.json


    - run: npm ci
    - run: npm run build